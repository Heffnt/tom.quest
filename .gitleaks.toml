# gitleaks configuration for tom.quest.
#
# Since uae phase 9 the secret scan feeds the `tests-run` head row the merge
# gate reads, so a gitleaks false positive is now a blocked merge rather than
# one red check nobody reads. This file exists to hold the exact false
# positives, BY VALUE, and nothing else: the default ruleset is extended and
# never replaced, and no path, rule, directory or file extension is exempted.
# Widening it to "test files are exempt" would hand every future secret a
# hiding place named `*.test.ts`. A value whose shape is too ordinary to be
# allowed everywhere is bound to its file as well, with `condition = "AND"`
# (the last entry) — narrower than a value alone, never wider.
#
# Why the values and not the inline directive: gitleaks scans every COMMIT in
# a branch's history, not the working tree. An inline `// gitleaks:allow` fixes
# the line from the commit that adds it onward — the commit that first
# introduced the fixture keeps failing forever, and the only ways out are
# rewriting history or this. The lines carry the inline directive as well, for
# whoever reads them; these regexes are what lets the history pass.
#
# Each entry names the file it is for and why the value has to look like a
# credential. An entry whose fixture is deleted should be deleted with it.

title = "tom.quest"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures that are credential-SHAPED on purpose and are not credentials."
regexTarget = "line"
regexes = [
  # convex/runs.test.ts, convex/http.test.ts — the canonical example UUID,
  # standing in for a run registration token. GET /tts/run-trace checks the
  # token's SHAPE before the indexed lookup, so a shapeless placeholder would
  # not exercise the path those suites exist for.
  '''3f2504e0-4f89-41d3-9a0c-0305e82c3301''',
  # convex/ttsMerge.test.ts — the shape IS the test: a trace finding that
  # quotes a credential-shaped line is exactly what that door must redact.
  '''ghp_0123456789abcdefghijABCD''',
  # convex/tts.test.ts — the same test one door over, for a prepare-door fault.
  # Long enough to match the real `github-pat` rule rather than generic-api-key,
  # and it has to be: the assertion is that the door redacted it back out.
  '''ghp_0123456789abcdefghijklmnopqrstuvwxyz''',
  # app/sessions/components/run.test.tsx — a content-addressed store path, not
  # a key. generic-api-key matched it on the field NAME ending in "Key".
  '''storeKey: "runs/claude/box/x/y"''',
  # worker/jobs/evals.test.mjs — the shape IS the test: the runner-failure
  # redaction path must remove a real credential-shaped token before it reaches an item.
  '''ghp_abcdefghijklmnopqrstuvwxyz1234567890''',
]

# THE ONE ENTRY THAT IS SCOPED TO A FILE AS WELL AS TO A VALUE.
#
# `condition = "AND"` is what makes that true: the finding is allowed only
# when the path matches AND the value matches. A `paths` entry on its own
# would exempt the whole file, which is the thing this config's header
# refuses; this is strictly narrower than the value-only entries above.
#
# WHAT IT IS FOR. convex/http.test.ts:436 at f5c1fb9 — a second
# run-registration token fixture, the reaction door's, written as a UUID for
# the same reason the one above it is: GET /tts/run-trace checks the token's
# SHAPE before the indexed lookup, so a shapeless placeholder would not
# exercise the path that suite exists for. gitleaks reads it as
# `generic-api-key` on entropy.
#
# It is here rather than in the list above because the value is a plain UUID
# with no prefix to make it distinctive: allowed everywhere it would hide a
# real token that happened to be that string anywhere in the repo. Bound to
# the one file that needs it, it hides exactly one line.
#
# Every push to main whose range includes f5c1fb9 fails the secret scan
# without this, and since uae phase 9 that is a BLOCKED MERGE rather than one
# red check — the scan feeds the `tests-run` head row the merge gate reads.
[[allowlists]]
description = "convex/http.test.ts — the reaction door's run-token fixture, credential-SHAPED on purpose."
condition = "AND"
paths = ['''^convex/http\.test\.ts$''']
regexTarget = "line"
regexes = [
  '''8f14e45f-ceea-467a-9a36-dedd4bea2543''',
]
