name: Guardrails

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  static-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:guardrails

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit -p tsconfig.json
      - run: pnpm test:turing
      # The production build, verified on every PR. It runs here rather than
      # relying on the Vercel check because Vercel's PREVIEW build is not the
      # production build (it skips `convex deploy`, which a PR branch must not
      # run), and because a build that only happens on the deploy platform is a
      # build nobody sees fail until after merge. Possible at all because the
      # public Convex URLs live in the committed .env — before that, CI had no
      # NEXT_PUBLIC_CONVEX_URL and `next build` died at the prerender step.
      - run: pnpm build
