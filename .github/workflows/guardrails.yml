name: Guardrails

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  static-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:guardrails

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # static-boundaries, secret-scan and tests are ONE verifier: every
  # deterministic check either runs in CI and reports through the
  # `tests-run` head row, or it fails the write it guards. Folding the other
  # two in here makes the merge gate strictly stricter, so a branch that
  # merged yesterday might not today.
  tests:
    needs: [static-boundaries, secret-scan]
    # Without this, a failed dependency SKIPS this job entirely: nothing
    # posts to /tts/tests, and the merge gate sees no row at all for the
    # commit — a different and worse failure than a red row.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit -p tsconfig.json
      - run: pnpm test:turing
      # The production build, verified on every PR. It runs here rather than
      # relying on the Vercel check because Vercel's PREVIEW build is not the
      # production build (it skips `convex deploy`, which a PR branch must not
      # run), and because a build that only happens on the deploy platform is a
      # build nobody sees fail until after merge. Possible at all because the
      # public Convex URLs live in the committed .env — before that, CI had no
      # NEXT_PUBLIC_CONVEX_URL and `next build` died at the prerender step.
      - run: pnpm build
      # The merge gate's first check (convex/ttsMerge.ts): this job's own
      # result, recorded against the commit it ran on. `if: always()` so a
      # RED run is recorded too — a missing row and a red row are different
      # facts, and the gate's deny message says which it found. Recorded once
      # per commit, so re-running until it flakes green changes nothing.
      # `-f` so a 401 or a 503 from /tts/tests fails THIS step: without it curl
      # exits 0 on an HTTP error, the row is silently absent, and the gate
      # denies with "no tests result is recorded" and nothing says why.
      - if: always() && vars.CONVEX_SITE_URL != ''
        run: |
          curl -fsS -X POST "$CONVEX_SITE_URL/tts/tests" \
            -H "X-Evals-Key: $EVALS_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"tom.quest\",\"sha\":\"$SHA\",\"ok\":$OK,\"detail\":\"$DETAIL\",\"url\":\"$RUN_URL\"}"
        env:
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
          EVALS_KEY: ${{ secrets.EVALS_KEY }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OK: ${{ job.status == 'success' && needs.static-boundaries.result == 'success' && needs.secret-scan.result == 'success' }}
          # QUOTED, and the colon after "guardrails" is gone: an unquoted YAML
          # scalar may not contain ": ", and one here made the whole workflow
          # file unparseable — every job in it, not just this step.
          DETAIL: "guardrails — tests ${{ job.status }}, static-boundaries ${{ needs.static-boundaries.result }}, secret-scan ${{ needs.secret-scan.result }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
