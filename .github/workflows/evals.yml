# The semantic half of the writing gate. Merging is the persist gate, so a
# change to a file the writing jobs read has to prove it did not make the
# outputs worse. The job posts a request to Convex and waits; the Jarvis Box
# picks it up on a cron tick and posts the run back. The box has no inbound
# door, and this needs no access to it.
name: Evals
#
# NO `paths:` FILTER, AND THAT IS THE POINT. This workflow used to fire only on
# a pull request that touched one of the watched paths — the list was spelled
# here a second time, beside scripts/evals-check.mjs's WATCHED_PATHS. Since the
# merge gate began asking the evals row for golden coverage (convex/ttsMerge.ts)
# a skipped workflow means NO ROW AT ALL, and no row denies: a pure-code pull
# request could never merge, with nothing on the log saying why.
#
# So the filter moved INTO the check, where the answer can be recorded, and
# WATCHED_PATHS is now the single spelling with no copy here to drift from it.
# The check reads its own diff against that list, and when NOTHING watched
# changed it posts a request marked `unaffected`, which the Convex door answers
# at once with an evals-run row saying so. No model runs, the check finishes in
# seconds, and the gate still has three rows that each say something true.
on:
  pull_request:
jobs:
  evals:
    runs-on: ubuntu-latest
    # Above scripts/evals-check.mjs's own 75-minute wait (measured on PR #170:
    # the box needed ~50 minutes for 29 items plus a clone and two worktrees).
    # A job timeout below that would kill the check before its own deadline and
    # report a job failure instead of the box's silence. An unaffected pull
    # request never approaches it — its row is waiting on the first poll.
    timeout-minutes: 85
    steps:
      # FULL HISTORY, not the default depth of one. The check reads its own
      # diff (`git diff BASE...HEAD`) to decide whether this branch is affected
      # at all and whether it owes a golden item, and a shallow clone has no
      # merge base to diff from. That failure is answered with "unjudged",
      # which asks the box for a full run and denies the merge gate's evals arm
      # if none comes — so a missing fetch-depth here reads as a branch that
      # pays fifty minutes for nothing, with nothing on the log saying why.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/evals-check.mjs
        env:
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
          EVALS_KEY: ${{ secrets.EVALS_KEY }}
          REPO: tom.quest
          SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
          # WHICH PUSH CAME FIRST. GitHub makes one run per push event, in the
          # order the events arrive, with an increasing id — the queue reads it
          # to tell a pull request's live head from the shas behind it, because
          # the order the requests REACH Convex is the order two jobs happened
          # to finish their checkout in, not the order the pushes happened.
          RUN_ID: ${{ github.run_id }}
          # The body carries the `evals: no-item <reason>` escape hatch. It
          # reaches the check as an ENVIRONMENT VALUE, never interpolated into
          # the `run:` line: a pull-request body is text anybody can write, and
          # expanded into a shell command it is a shell command anybody can
          # write.
          PR_BODY: ${{ github.event.pull_request.body }}
