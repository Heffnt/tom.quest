# The WikiTom copy of the evals check, kept here because WikiTom has no
# scripts/ of its own and this repo is where the checker lives. Copy it to
# WikiTom as .github/workflows/evals.yml; it fetches the checker from this
# repo's main at run time, so there is one body of gate() and no vendored
# second copy to drift.
#
# NO `paths:` FILTER, for the reason .github/workflows/evals.yml gives at
# length: a workflow that does not run records nothing, and the merge gate
# denies a head with no evals row. The checker it fetches holds WATCHED_PATHS
# and decides there, answering an unaffected branch in seconds.
#
# THERE IS NOTHING HERE FOR A FILTER TO NAME ANYWAY. WATCHED_PATHS is the union
# over BOTH repositories, and every entry in it but one names a file WikiTom
# does not have: no scripts/, no worker/, no evals/, no convex/. What WikiTom
# holds that a run reads is model-of-tom/, and since phase 6 the skill bodies
# are that directory's pages — so a change to a page moves what a run is built
# from whether it reaches the run as a layer or as a skill, and the checker
# sees it either way.
name: Evals
on:
  pull_request:
    # `edited` reruns when retargeting changes the `BASE...HEAD` watched diff
    # at the same head SHA, and when the body gains or loses its
    # `evals: no-item` trailer — nothing else would notice either. It fires on
    # every typo fixed in a description too, and those cost nothing: the Convex
    # door reads a re-filed request by its IDENTITY (the base sha, the changed
    # paths and that trailer, never the prose around it), so an edit that does
    # not touch the trailer is answered out of the run already scored
    # (convex/ttsEvals.ts internalRequestEvals).
    types: [opened, synchronize, reopened, edited]
jobs:
  evals:
    runs-on: ubuntu-latest
    # Above the checker's own 75-minute wait, so a silent box is reported as
    # silence rather than as a killed job.
    timeout-minutes: 85
    steps:
      # FULL HISTORY: the checker reads `git diff BASE...HEAD` to decide
      # whether this branch touched anything watched. A shallow clone has no
      # merge base, so every pull request would pay for a full run.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: curl -fsSL https://raw.githubusercontent.com/Heffnt/tom.quest/main/scripts/evals-check.mjs -o evals-check.mjs
      - run: node evals-check.mjs
        env:
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
          EVALS_KEY: ${{ secrets.EVALS_KEY }}
          REPO: WikiTom
          SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
          # See tom.quest's .github/workflows/evals.yml for why the queue needs
          # the event order as well as the pull request and head SHA.
          RUN_ID: ${{ github.run_id }}
          PR_BODY: ${{ github.event.pull_request.body }}
