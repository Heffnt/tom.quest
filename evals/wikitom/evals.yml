# The WikiTom copy of the evals check, kept here because WikiTom has no
# scripts/ of its own and this repo is where the checker lives. Copy it to
# WikiTom as .github/workflows/evals.yml; it fetches the checker from this
# repo's main at run time, so there is one body of gate() and no vendored
# second copy to drift.
#
# THIS LIST IS NOT A MIRROR of scripts/evals-check.mjs's WATCHED_PATHS, and
# scripts/evals-check.test.mjs pins that list against .github/workflows/
# evals.yml alone. WATCHED_PATHS is the union over BOTH repositories, and every
# entry in it but this one names a file WikiTom does not have: no scripts/, no
# worker/, no evals/, no convex/. What WikiTom holds that a run reads is
# model-of-tom/, and the skill bodies are that directory's pages — so a change
# to a page fires this whether it reaches a run as a layer or as a skill.
name: Evals
on:
  pull_request:
    paths:
      - "model-of-tom/**"
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: curl -fsSL https://raw.githubusercontent.com/Heffnt/tom.quest/main/scripts/evals-check.mjs -o evals-check.mjs
      - run: node evals-check.mjs
        env:
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
          EVALS_KEY: ${{ secrets.EVALS_KEY }}
          REPO: WikiTom
          SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
