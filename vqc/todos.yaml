- id: tts-session-wrapper
  readiness: ready-for-tom
  status: done
  created: 2026-08-28
  cites: [tts-spec:15, tts-spec:7]
  statement: >-
    The session surface: a Claude-desktop-like web chat page at
    tom.quest/sessions driving headless Claude Code sessions on the worker
    box via the Agent SDK — the substrate for tom-gates as interactive
    sessions, Focus entry actions, the weekly reflective session, and
    (later) two-way event messages. Designed first-principles (canvas
    explicitly not a precedent): Convex is the stream (daemon persists,
    browser subscribes), key-authed /sessions/* channel with its own
    SESSIONS_WORKER_KEY, two-tier transcript (finalized seq rows + one
    ≤16KB live-tail row), permissions wait indefinitely with stop/restart
    escape hatches, failure honesty derived from heartbeat staleness.
  completion_condition: >-
    From a phone: create a session, watch streamed output, answer a
    permission card, send a follow-up turn, stop the session — with the
    transcript surviving a daemon restart mid-turn.
  plan: >-
    convex/claudeSessions.ts (+6 tables, /sessions/poll + /sessions/ingest,
    tests), app/sessions page, worker/session-host daemon (SDK, systemd),
    entry buttons on Focus + Inventory, SDK-behavior prototypes on the Jarvis
    Box first (permission park, resume-after-kill, concurrency). Ratified
    2026-08-28 ("build it").
  resolution: >-
    Landed in the same commit as this entry. SDK prototypes validated all
    risky assumptions empirically (37-min permission park succeeded;
    resume-after-kill-9 intact; concurrent queries max-not-sum). 3-angle
    review found 26 candidates; all confirmed fixes applied (headliners:
    permanent-400 flush wedge → drop-and-report; force-close orphan
    settlement; terminal-state scalar guard; delivery race; keyAuth +
    TomGate dedup graduating ledger tts-shared-gate-dedup). 77/77 tests.

- id: tts-batches-autonomy-round
  readiness: ready-for-tom
  status: done
  created: 2026-08-28
  cites: [tts-spec:5, tts-spec:15]
  statement: >-
    Batches, plans, importance — a batch IS a dtsTodos row with members
    (life by todoId, code by repo+externalId) so every existing action works
    on it unchanged; plan steps with actor tom|agent drive the needs-you
    strip and batch session walk-throughs; importance {level, setBy} with a
    server guard so agent writes never clobber a Tom-set value; tomTouchedAt
    freezes a batch against batcher re-planning; form-batches worker cron
    proposes groupings.
  completion_condition: >-
    Batches render as the default tab, a batch session walks plan steps
    stopping at actor tom, and the batcher cron proposes groupings that
    survive the review round.
  plan: >-
    Ratified inline in a sibling session 2026-08-28.
  resolution: >-
    BACKFILLED 2026-08-29: this round landed as commits 8a45908 (feature)
    and a1267ed (29 review findings) without a registry entry — the
    governance miss that surfaced during the 2026-08-29 compliance check
    and prompted the agent-created-todos ruling. Entry added after the
    fact so closure is on record; details in the two commit messages.

- id: tts-session-render-honesty
  readiness: ready-for-tom
  status: done
  created: 2026-08-29
  cites: [C3, tts-spec:15]
  statement: >-
    The session surface's render layer drops facts the daemon records
    (2026-08-29 three-angle analysis): tool-result rows render as JSON of
    the wrapper object instead of the tool's output; isError is never
    surfaced so failed runs look like passes; truncationNote is never shown
    so cuts are silent; error rows render as JSON blobs; a Bash call shows
    input JSON in the transcript while the identical call shows the bare
    command on the permission card (compactInput has one caller); a note
    typed with Allow is silently discarded (daemon reads notes on deny
    only); decided permissions are unqueryable (pending-only query) so the
    ruling history is unreadable; daemon auto-denials leave no transcript
    trace; queued turns are labeled "sending" while actually waiting for
    the turn to end.
  completion_condition: >-
    Every recorded fact named in the statement is visible in the UI: a
    failed tool result is visually distinct, truncation is labeled, tool
    output renders as output text, allow-notes reach the model, permission
    decisions and auto-denials appear in the transcript, and a queued turn
    says it is queued.
  plan: >-
    Daemon normalizes tool-result content block-arrays to text and delivers
    notes on allow; a system row records each auto-denial; UI renders
    isError/truncationNote/compactInput and honest queue labels; a
    by_session permissions query (new index) exposes decisions. Pure repair
    of the ratified failure-honesty design — no new design decisions.
  resolution: >-
    Landed in the same commit as this closure (parallel-agent round,
    2026-08-29): daemon flattens tool-result block arrays to text at the
    source; out-of-workdir auto-denials write a system row; the UI renders
    tool output as output (toolResultTextOf), marks failed results, shows
    truncationNote footers, renders error rows legibly (errorTextOf), uses
    compactInput for tool-call one-liners, and labels queued turns
    honestly. The allow-note and decision-history items were OBSOLETED by
    the unified auto gate (nothing parks, so no notes and no new
    decisions); permission rows remain rendered for historical data.

- id: tts-session-auto-permissions
  readiness: ready-for-tom
  status: done
  created: 2026-08-29
  cites: [tts-spec:15]
  statement: >-
    Tom's ruling 2026-08-29 (adoption.md session-permission-posture):
    replace the indefinite-park permission model with classifier-driven
    auto mode. The parking removal LANDED in e90f66c (sibling session,
    Phases 2-3): nothing parks on Tom in any session mode; the boundary is
    throwaway workdir + session/<id> branches + Tom-only pens, with
    out-of-workdir edits auto-denied. REMAINING scope: the classifier — a
    cheap-model judgment on gated calls (with workdir/repo context) so the
    boundary is not the only defense on a box holding a push-capable
    GitHub token and Convex keys; its decisions and reasons land in the
    transcript. Any residual card kept is small, full-width, unobtrusive,
    and approves on Enter.
  completion_condition: >-
    A session completes a multi-tool turn (including Bash) with zero Tom
    interaction; each classifier decision is visible in the transcript
    with its reason; a destructive command outside the sanctioned set is
    refused with a recorded reason and the model course-corrects.
  plan: >-
    Three-tier Bash gate in the daemon: sanctioned pens free, ordinary
    commands free, danger-fingerprint commands ruled by a haiku classifier
    with verdicts as transcript rows, fail-open onto the structural
    boundary. Ratified via rulings 2026-08-29.
  resolution: >-
    Landed in the same commit as this closure: session.mjs #classifyBash
    (claude CLI, haiku, 30s timeout, per-session verdict cache), the
    danger-fingerprint and sanctioned-pen regexes, verdict + unavailable
    system rows. Live-fire verification (a real dangerous command denied
    in a prod session) pending the first session that trips the danger
    tier.

- id: tts-session-arrival-redesign
  readiness: ready-for-tom
  status: done
  created: 2026-08-29
  cites: [tts-spec:9, tts-spec:12]
  statement: >-
    Rebuild the session surface around arrival (arrive, orient, understand,
    rule, leave) instead of watching. Tom's rulings 2026-08-29 (adoption.md
    session-surface-rendering): full window width; tool calls visible but
    compact by default (one line, expand on demand); ALL agent natural
    language — assistant text and thinking — rendered in full. Plus the
    analysis-derived features: markdown and code rendering; per-row
    timestamps and turn grouping (fields exist unread); an unread-since-
    last-visit divider (client-held read position); the list restructured
    as a triage surface (needs-you first, per-row staleness, kind
    differentiation, create form collapsed); outcome records wired
    end-to-end (prompt tells the session its id and instructs recording;
    list and view render outcomeSummary); a live now-running indicator
    derived from the unmatched tool-call row.
  completion_condition: >-
    Returning to a running session after an hour on a phone, "what
    happened since I left, what is it doing right now, what does it need
    from me" are each answerable from one screen without scrolling the
    transcript, and an ended session leads with its outcome.
  plan: >-
    Tom's rulings 2026-08-29 (session-surface-rendering) plus the
    analysis-derived arrival features; built in the parallel-agent round.
  resolution: >-
    Landed in the same commit as this closure: full window width; all
    agent natural language (assistant text via a dependency-free markdown
    renderer, thinking in full, muted); tool calls compact one-liners
    with expand; turn separators with ingest-time clocks; the
    unread-since-last-visit divider (localStorage read position); honest
    live indicators (cursor only while running, unmatched-tool-call
    "running" line); outcome records wired end-to-end (createSession
    appends the session-outcome pen footer with the session id; list and
    view render outcome/outcomeSummary); the list reordered as a triage
    surface (needs-Tom first) with filter chips and a collapsed create
    form.

- id: tts-session-lifecycle
  readiness: ready-for-tom
  status: done
  created: 2026-08-29
  cites: [tts-spec:9]
  statement: >-
    Session lifecycle beyond the happy path: resume an ended session
    (sdkSessionId is retained and the daemon resumes by it — only the UI
    and the poll refuse today; spec §9 mandates re-entry); a stop guard
    that checks for uncommitted/unpushed work before the workdir is
    deleted (today Stop silently destroys unpushed work); rename; kind
    choice at create (weekly/gate creatable from the browser); list
    filtering by status/kind; an honest "showing latest 100" label on the
    capped list.
  completion_condition: >-
    An ended session accepts a follow-up turn and continues with context
    intact; stopping a session with unpushed workdir changes warns before
    deletion; a weekly-kind session can be created and found from the
    browser.
  plan: >-
    reopenSession + renameSession mutations, daemon work preservation
    before every workdir deletion, kind-at-create, list filters, cap
    label. Ratified via the 2026-08-29 triage.
  resolution: >-
    Landed in the same commit as this closure: reopenSession (ended/
    failed to idle, mode flips to interactive on takeover, daemon resumes
    by sdkSessionId), composer "Send - reopens session" path,
    renameSession + tap-to-rename, daemon #preserveWork (pushes local-only
    commits to session/<id>, records discarded uncommitted changes) on
    stop/auto-end/turn-death/force-kill, weekly kind creatable from the
    browser, filter chips, "showing the latest 100 sessions" label.

- id: tts-session-needs-you-notify
  readiness: ready-for-tom
  status: done
  created: 2026-08-29
  cites: [tts-spec:7]
  statement: >-
    The outbound half of event messages, pulled forward from
    tts-two-way-event-messages (Tom's triage 2026-08-29): a Slack message
    within a minute when a session needs Tom (residual permission, agent
    question, turn ended with a question) or completes something he awaits
    (outcome recorded), with a deep link to the session. Reuses the
    existing Slack webhook plumbing; reply-in-thread stays in the parent
    entry.
  completion_condition: >-
    A session that blocks on Tom produces a Slack message within a minute
    linking to it, and a session recording an outcome produces one message,
    not one per poll.
  plan: >-
    Edge-triggered Slack posts from internalIngest and the outcome pen,
    reusing the digest's chat.postMessage path and SLACK_TTS_CHANNEL_ID.
    Ratified via the 2026-08-29 triage.
  resolution: >-
    Landed: ttsSync internalSessionEventMessage (log-and-return on missing
    env, per the digest-env-missing-is-quiet ruling) scheduled on two LIVE
    edges - a failed ending (the live-to-terminal crossing in
    internalIngest) and the first outcome record (internalIngest's stamp
    and the agent's internalRecordOutcome pen) - each firing at most once,
    deep link included. Within-a-minute latency holds by construction
    (scheduler runAfter 0). A third edge, permission-request insert, was
    REMOVED as unreachable: under the unified auto gate the daemon allows
    or denies every tool call itself and never parks one for Tom, so
    nothing ever produced a permission request to notify about. The
    "needs Tom" half of this todo therefore has no live signal: wiring one
    to a reachable edge (a turn that ends with a question to Tom) is new
    work, not this todo's landed code. First real Slack post pending the
    next qualifying transition in prod.

